<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
    <defs>
      <!-- Rich Dramatic Background Gradient -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#180B14" />
        <stop offset="45%" stop-color="#35122B" />
        <stop offset="85%" stop-color="#521B42" />
        <stop offset="100%" stop-color="#050608" />
      </linearGradient>

      <!-- Shimmering Text Gradient -->
      <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F43F5E" />
        <stop offset="100%" stop-color="#BE123C" />
      </linearGradient>

      <!-- Center Spotlight Glow -->
      <radialGradient id="spotlight" cx="50%" cy="38%" r="65%">
        <stop offset="0%" stop-color="rgba(244, 63, 94, 0.4)" />
        <stop offset="55%" stop-color="rgba(0,0,0,0.2)" />
        <stop offset="100%" stop-color="transparent" />
      </radialGradient>

      <!-- Luxury Mesh Lines -->
      <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.4" />
        <stop offset="100%" stop-color="transparent" />
      </linearGradient>

      <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="16" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="heavyShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.95"/>
      </filter>
    </defs>
    
    <!-- Base Background -->
    <rect width="1200" height="700" fill="url(#bgGrad)"/>
    
    <!-- Radial Ambient Spotlight -->
    <rect width="1200" height="700" fill="url(#spotlight)"/>

    <!-- Geometric Skyline & Ray Silhouettes -->
    <g opacity="0.22">
      <!-- Light rays radiating from top center -->
      <polygon points="600,0 200,700 350,700" fill="url(#lineGrad)"/>
      <polygon points="600,0 850,700 1000,700" fill="url(#lineGrad)"/>
      <polygon points="600,0 520,700 680,700" fill="#F43F5E" opacity="0.15"/>
      
      <!-- Architectural silhouettes -->
      <rect x="100" y="380" width="110" height="320" fill="#F43F5E" rx="4"/>
      <rect x="230" y="300" width="130" height="400" fill="#F43F5E" rx="4"/>
      <rect x="380" y="420" width="90" height="280" fill="#F43F5E" rx="4"/>
      <rect x="730" y="350" width="120" height="350" fill="#F43F5E" rx="4"/>
      <rect x="870" y="270" width="140" height="430" fill="#F43F5E" rx="4"/>
      <rect x="1030" y="400" width="90" height="300" fill="#F43F5E" rx="4"/>
    </g>

    <!-- Glowing Luxury Border Frame -->
    <rect x="28" y="28" width="1144" height="644" fill="none" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.4" rx="20"/>
    <rect x="36" y="36" width="1128" height="628" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16"/>

    <!-- Corner Accents -->
    <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#F43F5E" stroke-width="3"/>
    <path d="M 1155 65 L 1155 45 L 1135 45" fill="none" stroke="#F43F5E" stroke-width="3"/>
    <path d="M 45 635 L 45 655 L 65 655" fill="none" stroke="#F43F5E" stroke-width="3"/>
    <path d="M 1155 635 L 1155 655 L 1135 655" fill="none" stroke="#F43F5E" stroke-width="3"/>

    <!-- Top Badge Header -->
    <g transform="translate(60, 60)">
      <rect width="210" height="36" rx="18" fill="#F43F5E" />
      <text x="105" y="23" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="2">
        😱 SHOCKING SCANDAL
      </text>
    </g>

    <!-- Top Right Series Tag -->
    <text x="1140" y="84" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" text-anchor="end" opacity="0.9" letter-spacing="1">
      TALEONIX ORIGINAL • EPISODE 1
    </text>

    <!-- Big Center Cinematic Typography -->
    <g filter="url(#heavyShadow)" text-anchor="middle">
      <!-- Ambient Backlight Circle -->
      <circle cx="600" cy="330" r="160" fill="rgba(244, 63, 94, 0.4)" opacity="0.6" filter="url(#cinematicGlow)"/>

      <!-- Main Title -->
      <text x="600" y="360" fill="url(#goldText)" font-family="'Outfit', sans-serif" font-size="52" font-weight="900" letter-spacing="1.5">
        SHOCKING SECRETS
      </text>

      <!-- Subtitle / Hook -->
      <text x="600" y="425" fill="#F1F5F9" font-family="'Lora', Georgia, serif" font-size="22" font-style="italic" font-weight="500" opacity="0.95" letter-spacing="0.5">
        The Gala DNA Test Revelation
      </text>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(60, 630)">
      <rect width="160" height="30" rx="6" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="80" y="20" fill="#F43F5E" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        🔥 98.9% RETENTION
      </text>
    </g>

    <text x="1140" y="650" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="end" opacity="0.8">
      US Serialized Entertainment • Read Full Story →
    </text>
  </svg>